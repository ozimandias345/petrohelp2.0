# Balanceador de cargas de PetroHelp.
#
# Reparte las peticiones de /api entre las dos replicas de Django.
# "least_conn" manda cada peticion a la replica con menos conexiones
# abiertas, que reparte mejor que el turno redondo cuando una consulta
# tarda mas que otra (por ejemplo, generar un reporte en PDF).

upstream petrohelp_api {
    least_conn;
    server api1:8000 max_fails=3 fail_timeout=15s;
    server api2:8000 max_fails=3 fail_timeout=15s;
}

server {
    listen 80;
    server_name _;

    # Tamano maximo de subida: las fotos de evidencia de las incidencias.
    client_max_body_size 12M;

    # La aplicacion web
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # La API, repartida entre las replicas
    location /api/ {
        proxy_pass http://petrohelp_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # Si una replica falla, la siguiente peticion va a la otra.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        # Encabezado de diagnostico: muestra que replica respondio.
        add_header X-Replica $upstream_addr always;
    }

    location /admin/ {
        proxy_pass http://petrohelp_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Replica $upstream_addr always;
    }

    location /static/ {
        proxy_pass http://petrohelp_api;
    }

    location /media/ {
        proxy_pass http://petrohelp_api;
    }
}
