# Blueprint de Render: crea la base de datos y el backend de PetroHelp.
# En Render: New > Blueprint > elegir este repositorio.

databases:
  - name: petrohelp-db
    plan: free

services:
  - type: web
    name: petrohelp-api
    runtime: python
    plan: free
    rootDir: backend/petrohelp_project
    buildCommand: bash build.sh
    startCommand: gunicorn petrohelp_backend.wsgi:application
    healthCheckPath: /admin/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: petrohelp-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # Estos dos los escribes tú en Render al crear el Blueprint:
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # Aplicación web (React): la página que ven los usuarios en el navegador.
  - type: web
    name: petrohelp-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_API_URL
        value: https://petrohelp-api.onrender.com/api
    routes:
      # React Router: cualquier ruta (/login, /tickets/5...) carga la app.
      - type: rewrite
        source: /*
        destination: /index.html
